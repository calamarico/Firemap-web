# Configuración del proyecto Cloudflare Pages (frontend estático + Functions).
# El backend Express de server/ sigue existiendo para el dev clásico con
# `npm run dev`; en Cloudflare lo sustituyen las Pages Functions de functions/.
name = "firemap-web"
compatibility_date = "2026-07-01"
pages_build_output_dir = "client/dist"

# Cache global de /api/fires: módulo y Cache API son locales a cada datacenter;
# KV es lo que permite que el cron de keep-warm caliente todos los colos.
[[kv_namespaces]]
binding = "FIRES_KV"
id = "cd729ecaa93c4cec8e8b703a71ba9f37"

# Base de datos de la app (feedback hoy; alertas push en el futuro).
[[d1_databases]]
binding = "APP_DB"
database_name = "radar-db"
database_id = "d317fa52-66a0-4054-95c0-f1f3ed345c10"
